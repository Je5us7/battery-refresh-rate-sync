# /etc/systemd/system/systemd-hybrid-sleep.service.d/10-refresh-rate-sync.conf
# systemd-hybrid-sleep.service only finishes AFTER the machine has resumed, so its ExecStartPost
# runs when we are awake again. Some drivers put the default mode back during
# resume, so re-apply the rate that matches the current power state.
[Service]
ExecStartPost=/usr/bin/systemctl --no-block restart refresh-rate-sync.service
