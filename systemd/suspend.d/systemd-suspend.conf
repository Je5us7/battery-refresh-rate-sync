# /etc/systemd/system/systemd-suspend.service.d/10-battery-refresh-rate-sync.conf
# systemd-suspend.service only finishes AFTER the machine has resumed, so its ExecStartPost
# runs when we are awake again. Some drivers put the default mode back during
# resume, so re-apply the rate that matches the current power state.
[Service]
ExecStartPost=/usr/bin/systemctl --no-block restart battery-refresh-rate-sync.service
