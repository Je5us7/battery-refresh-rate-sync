<?xml version="1.0" encoding="UTF-8"?>
<!-- "little monitor" icon shown in the notification when the refresh rate goes UP (AC power) -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4556"/>
      <stop offset="1" stop-color="#22283a"/>
    </linearGradient>
  </defs>

  <!-- monitor stand -->
  <rect x="54" y="88" width="20" height="14" rx="3" fill="#8d949f"/>
  <rect x="34" y="102" width="60" height="9" rx="4.5" fill="#787f8a"/>

  <!-- screen -->
  <rect x="10" y="12" width="108" height="78" rx="9" fill="#4c5665"/>
  <rect x="16" y="18" width="96" height="66" rx="5" fill="url(#scr)"/>

  <!-- arrow up = more Hz -->
  <path d="M64 28 L88 52 H74 V72 H54 V52 H40 Z" fill="#2ecc71"/>

  <!-- badge: lightning bolt (mains power) -->
  <circle cx="104" cy="94" r="19" fill="#f1c40f" stroke="#22283a" stroke-width="2"/>
  <path d="M106 80 L96 96 h7 l-3 12 11-17 h-7 z" fill="#22283a"/>
</svg>
