<?xml version="1.0" encoding="UTF-8"?>
<!-- "little monitor" icon shown in the notification when the refresh rate goes DOWN (battery) -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4556"/>
      <stop offset="1" stop-color="#22283a"/>
    </linearGradient>
  </defs>

  <!-- monitor stand -->
  <rect x="54" y="88" width="20" height="14" rx="3" fill="#8d949f"/>
  <rect x="34" y="102" width="60" height="9" rx="4.5" fill="#787f8a"/>

  <!-- screen -->
  <rect x="10" y="12" width="108" height="78" rx="9" fill="#4c5665"/>
  <rect x="16" y="18" width="96" height="66" rx="5" fill="url(#scr)"/>

  <!-- arrow down = fewer Hz -->
  <path d="M64 72 L40 48 H54 V28 H74 V48 H88 Z" fill="#e67e22"/>

  <!-- badge: battery -->
  <circle cx="104" cy="94" r="19" fill="#3498db" stroke="#22283a" stroke-width="2"/>
  <rect x="92" y="87" width="21" height="13" rx="3" fill="#22283a"/>
  <rect x="114" y="90.5" width="3.5" height="6" rx="1.5" fill="#22283a"/>
  <rect x="94.5" y="89.5" width="8" height="8" rx="1.5" fill="#e74c3c"/>
</svg>
