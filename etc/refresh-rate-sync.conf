# /etc/refresh-rate-sync.conf
#
# Configuration for refresh-rate-sync: switch the monitor refresh rate between
# "plugged in" and "on battery" automatically.
#
# There is no resident daemon: the service is started by udev on every power
# event and re-reads this file each time, so saving the file is enough -- no
# restart required.
#
# Per-user overrides (same keys, wins over this file):
#   ~/.config/refresh-rate-sync.conf

# --------------------------------------------------------------------------
# Target refresh rates
# --------------------------------------------------------------------------
# With the AC adapter connected: "max" = the highest rate the panel offers
# (165 Hz on a 2560x1600@165 laptop), or an explicit number (e.g. 165, 120).
AC_HZ=max

# On battery: a number of Hz (e.g. 60), or "max" / "min" for the highest /
# lowest mode available at the current resolution.
BATTERY_HZ=60

# --------------------------------------------------------------------------
# Session / desktop
# --------------------------------------------------------------------------
# Tool used to change the mode. auto = kscreen-doctor (KDE) -> hyprctl ->
# swaymsg -> wlr-randr -> xrandr.
RRS_BACKEND=auto

# 1 = only the built-in laptop panel (eDP/LVDS/DSI/DSL); external monitors are
# left alone. 0 = every connected output (external ones usually only have 60 Hz
# anyway, so nothing changes on them).
ONLY_INTERNAL=0

# Output name lists, space separated. TARGET_OUTPUTS empty = all outputs.
TARGET_OUTPUTS=""
SKIP_OUTPUTS=""

# What to do on machines without a battery (desktops): ac | bat | ignore
NO_BATTERY_STATE=ac

# --------------------------------------------------------------------------
# Desktop notifications
# --------------------------------------------------------------------------
NOTIFY=1              # 0 = do not show anything
NOTIFY_ICON=1         # use the "little monitor" SVG icon installed by the installer
NOTIFY_SNAPSHOT=0     # 1 = also attach a screenshot thumbnail (needs grim/spectacle/...)
NOTIFY_TIMEOUT=5000   # notification lifetime in ms
NOTIFY_FAIL=1         # also notify when the rate could not be changed
NOTIFY_LANG=auto      # notification language: auto (follows $LANG) | es | en

# --------------------------------------------------------------------------
# Retries (the compositor can be a moment late after unplug / resume / login)
# --------------------------------------------------------------------------
RATE_TOLERANCE=1.0     # Hz tolerance for "already at the target" (60.00 vs 59.94)
RETRIES=2              # retries when the new mode did not stick
RETRY_DELAY=2          # seconds between retries
SETTLE_DELAY=1         # seconds before verifying the change
BACKEND_RETRIES=3      # backend detection retries (session still starting)
BACKEND_RETRY_DELAY=2  # seconds between those retries

# --------------------------------------------------------------------------
# Root side (apply.sh)
# --------------------------------------------------------------------------
MIN_WAIT=1            # settling time after the udev event, in seconds
USERS_WANTED=""       # empty = every local graphical session, else e.g. "alice bob"
